name: Docker 镜像

# 推 main / 打 v* 标签时构建并发布镜像到 GHCR；
# Pull Request 只做构建 + 冒烟测试，不推送。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 同一分支上新的运行会取消上一次还没跑完的
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint & tests
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check app tests

      - name: pytest
        run: pytest tests -q

  verify:
    name: 构建并冒烟测试
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（只留在本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fn-media-ext:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像里没有挂任何源数据库，应用会退化成「同步失败但可用」，
      # /health 依然应当返回 200 且 ok=true——这条断言就是它的验收标准。
      - name: 冒烟测试 /health
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8787:8787 fn-media-ext:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS -m 3 http://127.0.0.1:8787/health || true)
            if [ -n "$body" ]; then
              echo "GET /health -> $body"
              echo "$body" | grep -q '"ok":true'
              echo "冒烟测试通过"
              break
            fi
            sleep 2
            if [ "$i" = 30 ]; then
              echo "::error::/health 在 60 秒内没有返回可用响应"
              docker logs smoke || true
              exit 1
            fi
          done
          # UI2 模板必须在镜像里（v1.6.0 曾因 Dockerfile 漏拷 templates2，
          # /health 照样 ok 但带 ui=2 cookie 的页面全部 500）。全新容器没有
          # 账号，首页会 303 到 /setup；setup 页走同一个双引擎选择器，
          # 引用了 ui2.css 就证明 templates2 真的在镜像里。
          if curl -fsSL -m 5 -H "Cookie: fnxt.ui=2" http://127.0.0.1:8787/ | grep -q 'ui2.css'; then
            echo "UI2 模板确认在镜像中"
          else
            echo "::error::镜像缺少 templates2（ui=2 请求没有渲染 UI 2.0）"
            docker logs smoke || true
            exit 1
          fi

      - name: 清理容器
        if: always()
        run: docker rm -f smoke || true

  publish:
    name: 发布到 GHCR
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送（amd64 + arm64，群晖/树莓派可用）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
