name: Docker 镜像

# 推 main / 打 v* 标签时构建并发布镜像到 GHCR；
# Pull Request 只做构建 + 冒烟测试，不推送。
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# 同一分支上新的运行会取消上一次还没跑完的
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 构建并冒烟测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建镜像（只留在本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: fn-media-ext:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 镜像里没有挂任何源数据库，应用会退化成「同步失败但可用」，
      # /health 依然应当返回 200 且 ok=true——这条断言就是它的验收标准。
      - name: 冒烟测试 /health
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8787:8787 fn-media-ext:ci
          for i in $(seq 1 30); do
            body=$(curl -fsS -m 3 http://127.0.0.1:8787/health || true)
            if [ -n "$body" ]; then
              echo "GET /health -> $body"
              echo "$body" | grep -q '"ok":true'
              echo "冒烟测试通过"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/health 在 60 秒内没有返回可用响应"
          docker logs smoke || true
          exit 1

      - name: 清理容器
        if: always()
        run: docker rm -f smoke || true

  publish:
    name: 发布到 GHCR
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
