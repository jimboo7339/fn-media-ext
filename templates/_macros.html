{% macro poster(path, hue, initial, cls='') -%}
<div class="pst {{ cls }}" style="--h:{{ hue }}"><span>{{ initial }}</span>{% if path %}<img src="/img/{{ path }}" alt="" loading="lazy" onerror="this.remove()">{% endif %}</div>
{%- endmacro %}

{# Runs before the stylesheet paints so the chosen theme never flashes. #}
{% macro themeboot() -%}
<script>try{var q=(location.search.match(/[?&]theme=(light|dark|auto)/)||[])[1];if(q){localStorage.setItem("fnxt.theme",q)}var p=localStorage.getItem("fnxt.theme")||"auto";var m=window.matchMedia("(prefers-color-scheme: light)").matches;var d=p==="auto"?(m?"light":"dark"):p;var r=document.documentElement;r.setAttribute("data-theme",d);r.setAttribute("data-pref",p)}catch(e){}</script>
{%- endmacro %}

{% macro themebar(cls='') -%}
<div class="themebar {{ cls }}" role="group" aria-label="主题">
  <button type="button" data-theme-set="auto" title="跟随系统" aria-label="跟随系统">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
  <button type="button" data-theme-set="light" title="浅色" aria-label="浅色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg></button>
  <button type="button" data-theme-set="dark" title="深色" aria-label="深色">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 13.4A8 8 0 1 1 10.6 4a6.4 6.4 0 0 0 9.4 9.4z"/></svg></button>
</div>
{%- endmacro %}
