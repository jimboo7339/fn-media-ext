<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>登录 · 观影时间线</title>
{% from "_macros.html" import themeboot, themes, mark %}
{{ themeboot() }}
<link rel="stylesheet" href="/static/ui2.css?v=2">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="/static/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
</head>
<body>
<div class="gate">
  {{ themes() }}
  <form class="box" method="post" action="/login">
    <div class="logo">{{ mark() }}</div>
    <h1>观影时间线</h1>
    <p>仅管理员可访问</p>
    {% if err %}<div class="err" style="margin:0 0 10px">用户名或密码不正确</div>{% endif %}
    {% if pw %}<div class="ok" style="margin:0 0 10px">密码已更新，请重新登录</div>{% endif %}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="f-username">用户名</label>
    <input id="f-username" type="text" name="username" autofocus autocomplete="username">
    <label for="f-password" style="margin-top:14px">密码</label>
    <input id="f-password" type="password" name="password" autocomplete="current-password">
    <button class="btn primary" type="submit">登录</button>
  </form>
</div>
<script src="/static/ui2.js?v=2"></script>
</body>
</html>
